name: Publish Orbit Lab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify orbital calculations
        run: npm test
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify simulation backend
        run: |
          python -m pip install -r backend/requirements.txt
          python -m unittest discover -s backend -t . -p 'test_*.py' -v
      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html app.js orbits.js lab.js science.js orbital-physics.js fragment-worker.js random.js risk.js help.js population-model.js catalog-worker.js simulation-worker.js styles.css CREDITS.md _site/
          cp -R assets vendor downloads data validation _site/
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
